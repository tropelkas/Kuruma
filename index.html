<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuruma</title>
<meta name="theme-color" content="#0a6c7e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: barra superior, vista con scroll y navegación inferior fija; pensada para el móvil. */
:root{
  --bg:#f1f5f6; --card:#ffffff; --ink:#10282f; --muted:#587078; --line:#d9e2e5;
  --accent:#0a6c7e; --accent-ink:#ffffff; --chip:#e8eff1;
  --ok:#1b8548; --warn:#a9640c; --crit:#be3a2b; --info:#2b6cb0;
  --font-display:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1a1f; --card:#13262d; --ink:#e4eff2; --muted:#93acb4; --line:#25404a;
    --accent:#38b6cb; --accent-ink:#06222a; --chip:#1c343d;
    --ok:#4cc27d; --warn:#e0a24b; --crit:#f0786a; --info:#6ea8e6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1a1f; --card:#13262d; --ink:#e4eff2; --muted:#93acb4; --line:#25404a;
  --accent:#38b6cb; --accent-ink:#06222a; --chip:#1c343d;
  --ok:#4cc27d; --warn:#e0a24b; --crit:#f0786a; --info:#6ea8e6; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 var(--font-body);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font:700 21px var(--font-display);letter-spacing:.2px}
.brand small{font:500 12px var(--font-body);color:var(--muted);margin-left:8px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on i{background:var(--ok)} .pill.off i{background:var(--crit)}
main{flex:1;overflow-y:auto;padding:16px}
.wrap{width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pad{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:700 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.crit b{color:var(--crit)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.group-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;background:var(--c,var(--muted))}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 12px;border-top:1px solid var(--line);border-left:4px solid var(--c,transparent)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.tag{font:600 14px var(--font-mono);background:var(--chip);border-radius:8px;padding:5px 8px;min-width:58px;text-align:center;white-space:nowrap}
.lv-crit{--c:var(--crit)} .lv-warn{--c:var(--warn)} .lv-go{--c:var(--ok)} .lv-info{--c:var(--info)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;white-space:nowrap;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.field textarea{min-height:76px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--chip)}
.hint.warn{background:color-mix(in srgb,var(--warn) 16%,var(--card))}
.hint.go{background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--chip);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .when{width:88px;flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .what{flex:1;min-width:0}
.tl .what b{font-weight:600}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 16px;font-size:14px}
.bar-row .meter{grid-column:1/3;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar-row .meter i{display:block;height:100%;background:var(--crit)}
.nav{display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px 4px}
.nav button{background:none;border:0;min-height:48px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .plus{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin:-18px auto 0;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:28px;line-height:1;min-height:52px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,18,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet header{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%;display:none}
.toast.show{display:block}
.card table td,.card table th{padding:7px 6px;vertical-align:top}.card table td:first-child,.card table th:first-child{padding-left:12px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.chart text{fill:var(--muted);font:11px var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{fill:var(--card);stroke:var(--crit);stroke-width:2}
.chart .curve{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .area{fill:var(--accent);opacity:.12}
.chips-multi{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">kuruma<small id="today"></small></div>
  <span class="pill" id="conn"><i></i><span>conectando</span></span>
</header>
<main id="main"></main>
<nav class="nav" aria-label="Secciones">
  <button data-tab="hoy"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Hoy</button>
  <button data-tab="animales"><svg viewBox="0 0 24 24"><path d="M3 12c3-5 8-6 13-3l5-2-1 5 1 5-5-2c-5 3-10 2-13-3z"/><circle cx="8" cy="11" r=".6"/></svg>Animales</button>
  <button class="plus" id="fab" aria-label="Registrar evento">+</button>
  <button data-tab="bajas"><svg viewBox="0 0 24 24"><path d="M4 5v14h16"/><path d="M7 8l4 4 3-2 5 7"/></svg>Bajas</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Ajustes</button>
</nav>
<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
/* ---------- Parámetros iniciales: tiempos de Fuseya (2014), 24 °C ---------- */
var DEF={moltMin:17,moltMax:27,ablateIdeal:2,ablateTo:3,ablateLate:10,peakFrom:8,peakTo:12,gapMax:4,ovaryEvery:3,minTL:140,wa:''};
var CAUSAS=['Postablación','Problema en la muda','Manejo o estrés','Canibalismo','Salto fuera del tanque','Calidad del agua','Enfermedad','Desconocida'];
var SIGNOS=['Caparazón blando','Enroscada de lado','Pleópodos perdidos','Manchas negras','Herida del ojo ablacionado','Sin signos visibles'];
var TIPOS=[['muda','Muda'],['ablacion','Ablación'],['ovario','Ovario'],['puesta','Puesta'],['baja','Baja'],['traslado','Traslado'],['nota','Nota']];

var S={animals:[],events:[],cfg:{},meta:{},lotes:[],rondaDate:'',persist:null,tab:'hoy',aid:null,filter:'todos',q:'',db:null,loaded:{animals:false,events:false,cfg:false},by:{},byId:{}};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nf=function(n,d){return Number(n).toLocaleString('es-ES',{maximumFractionDigits:d||0})};
var P=function(){return Object.assign({},DEF,S.cfg)};
var day0=function(d){var x=new Date(d);x.setHours(0,0,0,0);return x};
var dd=function(a,b){return Math.round((day0(b)-day0(a))/864e5)};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var sym=function(a){return a.sex==='F'?'♀':'♂'};
var tagOf=function(a){return sym(a)+' '+a.tag};
var fmtDT=function(ts){return new Date(ts).toLocaleString('es-ES',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
var fmtD=function(ts){return new Date(ts).toLocaleDateString('es-ES',{day:'numeric',month:'short'})};
var localInput=function(d){var x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
var typeName=function(t){var r=TIPOS.filter(function(x){return x[0]===t})[0];return r?r[1]:t};

/* ---------- Base de datos local (IndexedDB en este móvil) ---------- */
function localDb(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('Sin IndexedDB'));return}
    var rq=indexedDB.open('kuruma',1);
    rq.onupgradeneeded=function(){['animals','events','cfg'].forEach(function(n){rq.result.createObjectStore(n,{keyPath:'id'})})};
    rq.onerror=function(){rej(rq.error)};
    rq.onsuccess=function(){
      var d=rq.result,subs={};
      function all(n){return new Promise(function(ok,ko){var t=d.transaction(n).objectStore(n).getAll();t.onsuccess=function(){ok(t.result)};t.onerror=function(){ko(t.error)}})}
      function fire(n){all(n).then(function(rows){(subs[n]||[]).forEach(function(cb){cb(rows.map(function(r){return {id:r.id,data:function(){return r}}}))})})}
      function tx(n,fn){return new Promise(function(ok,ko){var t=d.transaction(n,'readwrite');fn(t.objectStore(n));t.oncomplete=function(){ok();fire(n)};t.onerror=function(){ko(t.error)}})}
      res({
        collection:function(n){return {onSnapshot:function(cb){(subs[n]=subs[n]||[]).push(cb);fire(n)}}},
        doc:function(p){var s=p.split('/');return {
          set:function(o){return tx(s[0],function(st){st.put(Object.assign({},o,{id:s[1]}))})},
          delete:function(){return tx(s[0],function(st){st.delete(s[1])})}}}
      });
    };
  });
}
function docsOf(snap){
  if(Array.isArray(snap))return snap;
  if(snap&&snap.docs)return snap.docs;
  var out=[];if(snap&&typeof snap.forEach==='function')snap.forEach(function(d){out.push(d)});return out;
}
function rowOf(d){
  var data=typeof d.data==='function'?d.data():(d.data||d);
  return Object.assign({},data,{id:d.id||(data&&data.id)});
}
function sub(name,key){
  var col=S.db.collection(name);
  col.onSnapshot(function(snap){
    var rows=docsOf(snap).map(rowOf);
    if(name==='cfg'){S.cfg=rows.filter(function(r){return r.id==='params'})[0]||{};S.meta=rows.filter(function(r){return r.id==='meta'})[0]||{};S.lotes=(rows.filter(function(r){return r.id==='lotes'})[0]||{}).items||[]}
    else S[key]=rows;
    S.loaded[name]=true;render();
  },function(err){toast('Error de lectura: '+(err&&err.message||err))});
}
function save(col,id,obj){
  var o=Object.assign({},obj);delete o.id;
  return S.db.doc(col+'/'+id).set(o).then(function(){
    var list=col==='animals'?S.animals:col==='events'?S.events:null;
    if(list){var i=list.findIndex(function(r){return r.id===id});var row=Object.assign({},o,{id:id});if(i>=0)list[i]=row;else list.push(row)}
    if(col==='cfg'){if(id==='meta')S.meta=Object.assign({},o,{id:id});else if(id==='lotes')S.lotes=o.items||[];else S.cfg=Object.assign({},o,{id:id})}
    render();
  });
}
function remove(col,id){
  return S.db.doc(col+'/'+id).delete().then(function(){
    if(col==='events')S.events=S.events.filter(function(r){return r.id!==id});
    if(col==='animals')S.animals=S.animals.filter(function(r){return r.id!==id});
    render();
  });
}
function fail(e){toast('No se pudo guardar: '+(e&&e.message||e))}

/* ---------- Cálculos por animal ---------- */
function build(){
  var by={};S.events.forEach(function(e){(by[e.animalId]=by[e.animalId]||[]).push(e)});
  Object.keys(by).forEach(function(k){by[k].sort(function(a,b){return a.ts<b.ts?-1:a.ts>b.ts?1:0})});
  S.by=by;S.byId={};S.animals.forEach(function(a){S.byId[a.id]=a});
}
function info(a,now){
  now=now||new Date();
  var ev=S.by[a.id]||[],alive=a.status!=='baja',end=alive?now:new Date(a.deathTs||now);
  function last(t){for(var i=ev.length-1;i>=0;i--)if(ev[i].type===t)return ev[i];return null}
  var lm=last('muda'),ab=ev.filter(function(e){return e.type==='ablacion'})[0]||null,lo=last('ovario'),lp=last('puesta');
  return {ev:ev,alive:alive,lm:lm,ab:ab,lo:lo,lp:lp,
    dpm:lm?dd(lm.ts,end):null,dpa:ab?dd(ab.ts,end):null,
    nPuestas:ev.filter(function(e){return e.type==='puesta'}).length,
    dOv:lo?dd(lo.ts,now):null,dSp:lp?dd(lp.ts,now):null};
}
function alerts(){
  var p=P(),out=[];
  S.animals.filter(function(a){return a.status!=='baja'&&a.sex==='F'}).forEach(function(a){
    var i=info(a);
    function add(kind,lvl,title,detail,act){out.push({a:a,kind:kind,lvl:lvl,title:title,detail:detail,act:act})}
    if(!i.ab){
      if(i.dpm==null)add('sinmuda','info','Sin muda registrada','Sin la fecha de muda no se calcula la ventana de ablación.','muda');
      else if(i.dpm<p.ablateIdeal)add('ablarpronto','info','Ablar en '+(p.ablateIdeal-i.dpm)+' d','Día '+i.dpm+' tras la muda. El ensayo ablaba el día '+p.ablateIdeal+'.','ablacion');
      else if(i.dpm<=p.ablateTo)add('ablarhoy','go','Ablar hoy','Día '+i.dpm+' tras la muda. En el ensayo, ablar el día 2 dio 90 % de puesta y ninguna muerte hasta el día 23; el día 3 (ensayo de temperatura, 24 °C) puso el 100 %.','ablacion');
      else if(i.dpm<p.ablateLate)add('ablarsin','info','Días sin dato del ensayo','Día '+i.dpm+' tras la muda. El ensayo no probó los días 4 a 9: no hay referencia. Si ablas ahora, anótalo para tener tu propio dato.','ablacion');
      else if(i.dpm<17)add('ablartarde2','crit','Ablación tardía','Día '+i.dpm+' tras la muda. En el ensayo, ablar el día 10 dio 75 % de puesta y el 33,3 % murió sin poner ni mudar.','ablacion');
      else add('ablartarde2','crit','Ablación tardía','Día '+i.dpm+' tras la muda. En el ensayo, ablar el día 17 dio 40 % de puesta, la más baja.','ablacion');
    }else{
      if(i.dpa>=p.peakFrom&&i.dpa<=p.peakTo)add('pico','go','Vigilar puesta','Día '+i.dpa+' tras la ablación. El pico del ensayo fue el día 10.','puesta');
      else if(i.dpa>p.peakTo&&!i.lp)add('sinpuesta','warn','Sin puesta registrada','Día '+i.dpa+' tras la ablación y ninguna puesta anotada.','puesta');
      if(i.lp&&i.dSp>p.gapMax&&i.dpm!=null&&i.dpm<p.moltMin)add('hueco','warn','Hueco entre puestas','Última puesta hace '+i.dSp+' d. Intervalo habitual en el ensayo: 2 a 4 d.','puesta');
    }
    if(i.dpm!=null&&!i.ab){
      if(i.dpm>=p.moltMin&&i.dpm<=p.moltMax)add('muda','info','Ventana de muda','Día '+i.dpm+' desde la última muda (ciclo del ensayo: '+p.moltMin+' a '+p.moltMax+' d). Revisar a diario.','muda');
      else if(i.dpm>p.moltMax)add('mudaret','warn','Muda retrasada','Día '+i.dpm+' desde la última muda.','muda');
    }
    if(i.dOv==null||i.dOv>=p.ovaryEvery)add('ovario',(i.dOv==null||i.dOv>=p.ovaryEvery+2)?'warn':'info','Medir ovario',i.dOv==null?'Todavía sin medida.':'Última medida hace '+i.dOv+' d.','ovario');
  });
  var rank={crit:0,warn:1,go:2,info:3};
  out.sort(function(x,y){return rank[x.lvl]-rank[y.lvl]||(+x.a.tag||0)-(+y.a.tag||0)});
  return out;
}
var KIND_LABEL={ablarhoy:'Ablar hoy',ablarpronto:'Ablar en los próximos días',ablarsin:'Días sin dato del ensayo',ablartarde2:'Ablación tardía',pico:'Vigilar puesta',sinpuesta:'Sin puesta registrada',hueco:'Hueco entre puestas',muda:'Ventana de muda',mudaret:'Muda retrasada',ovario:'Medir ovario',sinmuda:'Sin muda registrada'};
var KIND_ORDER=['ablartarde2','ablarhoy','pico','sinpuesta','hueco','mudaret','ablarsin','ablarpronto','muda','ovario','sinmuda'];
var ACT_LABEL={ablacion:'Registrar ablación',puesta:'Registrar puesta',muda:'Registrar muda',ovario:'Registrar medida'};

/* ---------- Vistas ---------- */
function setConn(){
  var c=$('#conn');
  if(!S.db){c.className='pill off';c.lastChild.textContent='sin almacenamiento';return}
  var ok=S.loaded.animals&&S.loaded.events;
  c.className='pill '+(ok?'on':'');c.lastChild.textContent=ok?'guardado en este móvil':'cargando';
}
function render(){
  build();setConn();
  var m=$('#main'),st=m.scrollTop;
  var views={hoy:vHoy,ronda:vRonda,puesta:vPuesta,animales:vAnimales,ficha:vFicha,bajas:vBajas,ajustes:vAjustes};
  m.innerHTML='<div class="wrap">'+views[S.tab]()+'</div>';
  m.scrollTop=st;
  document.querySelectorAll('.nav [data-tab]').forEach(function(b){

/* ---------- Resultados de puesta (comparados con Fuseya 2014) ---------- */
function cicloAblacion(a){
  var i=info(a);if(!i.ab)return null;
  var ev=i.ev,abTs=i.ab.ts,m0=lastBefore(ev,'muda',abTs);
  var nextM=ev.filter(function(e){return e.type==='muda'&&e.ts>abTs})[0]||null;
  var end=nextM?nextM.ts:null;
  var sp=ev.filter(function(e){return e.type==='puesta'&&e.ts>=abTs&&(!end||e.ts<end)});
  var eggs=sp.filter(function(e){return e.eggs>0}).map(function(e){return e.eggs});
  var gaps=[];for(var k=1;k<sp.length;k++)gaps.push(dd(sp[k-1].ts,sp[k].ts));
  return {a:a,dAb:m0?dd(m0.ts,abTs):null,closed:!!nextM||a.status==='baja',spawns:sp.length,eggsTot:eggs.length?eggs.reduce(function(x,y){return x+y},0):null,eggsN:eggs.length,
    dMuPu:(m0&&sp.length)?dd(m0.ts,sp[0].ts):null,dAbPu:sp.length?dd(abTs,sp[0].ts):null,gaps:gaps,
    died:a.status==='baja'&&!sp.length&&!nextM};
}

/* ---------- Bajas y curva de supervivencia ---------- */
function km(rows){
  rows.sort(function(a,b){return a.t-b.t});
  var n=rows.length,s=1,pts=[{t:0,s:1}],i=0;
  while(i<rows.length){
    var t=rows[i].t,d=0,c=0,j=i;
    while(j<rows.length&&rows[j].t===t){rows[j].d?d++:c++;j++}
    if(d){s*=(1-d/n);pts.push({t:t,s:s})}
    n-=d+c;i=j;
  }
  return pts;
}
function chartSup(){
  var now=new Date(),rows=[];
  S.animals.forEach(function(a){
    var i=info(a);if(!i.ab)return;
    rows.push({t:i.dpa,d:a.status==='baja'});
  });
  if(!rows.length)return '<div class="empty">Aún no hay animales ablacionados. La curva aparece al registrar la primera ablación.</div>';
  var pts=km(rows),maxT=Math.max.apply(null,rows.map(function(r){return r.t}));
  var xmax=Math.max(60,Math.ceil(maxT/10)*10),W=340,H=236,L=36,R=12,T=26,B=44;
  var X=function(t){return L+(W-L-R)*t/xmax},Y=function(s){return T+(H-T-B)*(1-s)};
  var d='M'+X(0)+' '+Y(1);
  pts.forEach(function(p,k){if(k===0)return;d+=' H'+X(p.t)+' V'+Y(p.s)});
  var lastS=pts[pts.length-1].s;d+=' H'+X(maxT);
  var grid='',lab='',k;
  [0,.25,.5,.75,1].forEach(function(v){grid+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+(v*100)+'</text>'});

/* ---------- Ajustes ---------- */
function cicloObservado(){
  var gaps=[];
  S.animals.forEach(function(a){var m=(S.by[a.id]||[]).filter(function(e){return e.type==='muda'});for(var k=1;k<m.length;k++)gaps.push(dd(m[k-1].ts,m[k].ts))});
  if(!gaps.length)return 'Aún no hay dos mudas seguidas de un mismo animal.';
  gaps.sort(function(a,b){return a-b});
  var mean=gaps.reduce(function(s,x){return s+x},0)/gaps.length;
  return 'Intervalo medio entre mudas: '+nf(mean,1)+' d (de '+gaps[0]+' a '+gaps[gaps.length-1]+' d, '+gaps.length+' intervalos).';
}

/* ---------- Copia de seguridad ---------- */
function snapshotAll(){return {app:'kuruma',version:1,exportedAt:new Date().toISOString(),animals:S.animals,events:S.events,cfg:S.cfg,lotes:S.lotes}}
function backupName(){return 'kuruma-copia-'+new Date().toISOString().slice(0,10)+'.json'}
function markBackup(){return save('cfg','meta',{lastBackup:new Date().toISOString()}).catch(function(){})}
function doExport(){
  var blob=new Blob([JSON.stringify(snapshotAll(),null,1)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=backupName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},5000);
  markBackup().then(function(){toast('Copia descargada')});
}
function doShare(){
  var file=new File([JSON.stringify(snapshotAll(),null,1)],backupName(),{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Copia de kuruma'}).then(function(){return markBackup()}).then(function(){toast('Copia compartida')}).catch(function(){});
  }else toast('Este navegador no puede compartir archivos. Usa Descargar copia.');
}
function doImport(file){
  var r=new FileReader();
  r.onload=function(){
    var d;try{d=JSON.parse(r.result);if(d.app!=='kuruma'||!Array.isArray(d.animals)||!Array.isArray(d.events))throw new Error('no es una copia de kuruma')}catch(e){toast('Archivo no válido: '+e.message);return}
    confirmBox('Se importarán '+d.animals.length+' animales y '+d.events.length+' eventos. Si ya existen, se sobrescriben.',function(){
      var jobs=d.animals.map(function(a){return save('animals',a.id,a)}).concat(d.events.map(function(e){return save('events',e.id,e)}));
      if(d.cfg&&Object.keys(d.cfg).length)jobs.push(save('cfg','params',d.cfg));
      if(Array.isArray(d.lotes)&&d.lotes.length)jobs.push(save('cfg','lotes',{items:d.lotes}));
      Promise.all(jobs).then(function(){toast('Copia importada')}).catch(fail);
    },'Importar');
  };
  r.readAsText(file);
}
function vCopia(){
  var lb=S.meta&&S.meta.lastBackup,days=lb?dd(lb,new Date()):null,canShare=!!(navigator.canShare);
  return '<section class="card pad" style="display:flex;flex-direction:column;gap:14px"><h2>Copia de seguridad</h2>'
   +'<p class="muted small" style="margin:0">Los datos están solo en este móvil. Si borras los datos del navegador o pierdes el teléfono, se pierden. Guarda una copia con frecuencia.</p>'
   +'<div class="hint'+((lb&&days<=7)?'':' warn')+'">'+S.animals.length+' animales · '+S.events.length+' eventos · '+(lb?'última copia hace '+days+' d ('+fmtD(lb)+')':'todavía sin copia')+'</div>'
   +'<div class="hint">Almacenamiento protegido contra borrado automático: '+(S.persist===true?'sí':S.persist===false?'no concedido':'comprobando')+'.</div>'
   +'<div class="btns"><button class="btn primary" data-act="export">Descargar copia</button>'+(canShare?'<button class="btn" data-act="share">Compartir copia</button>':'')

}

    var tag=($('#a-tag').value||'').trim();if(!tag){toast('Indica la etiqueta');return}
    if(S.animals.some(function(x){return String(x.tag)===tag&&x.id!==id})){toast('Ya existe un animal con la etiqueta '+tag);return}
    var o=Object.assign({},a,{tag:tag,sex:$('#a-sex').value,tank:($('#a-tank').value||'').trim(),lote:$('#a-lote').value,notes:($('#a-n').value||'').trim()});
    ['tl','cl','bw'].forEach(function(k){var v=num('#a-'+k);if(v===null)delete o[k];else o[k]=v});
    if(!id){o.status='vivo';o.createdAt=new Date().toISOString()}
    var nid=id||uid();
    save('animals',nid,o).then(function(){closeSheet();toast('Ficha guardada');if(!id){S.aid=nid;S.tab='ficha';render()}}).catch(fail);
  };
}

/* ---------- Lotes ---------- */
var FEEDS=['Poliqueto','Pienso compuesto','Mixto','Otro'];
function openLote(id){
  if(!S.db){toast('Sin almacenamiento');return}
  var l=id?S.lotes.filter(function(x){return x.id===id})[0]:{};
  openSheet('<header><h2>'+(id?'Editar lote':'Nuevo lote')+'</h2><button class="btn sm" id="l-x">Cerrar</button></header>'
   +'<div class="field"><label for="l-name">Nombre del lote</label><input id="l-name" value="'+esc(l.name||'')+'"></div>'
   +'<div class="grid2"><div class="field"><label for="l-temp">Temperatura (°C)</label><input id="l-temp" type="number" inputmode="decimal" step="0.5" value="'+esc(l.temp==null?'':l.temp)+'"></div>'
   +'<div class="field"><label for="l-light">Horas de luz al día</label><input id="l-light" type="number" inputmode="decimal" step="0.5" min="0" max="24" value="'+esc(l.light==null?'':l.light)+'"></div></div>'
   +'<div class="field"><label for="l-feed">Alimento</label><select id="l-feed"><option value="">Sin indicar</option>'+FEEDS.map(function(f){return '<option'+(l.feed===f?' selected':'')+'>'+f+'</option>'}).join('')+'</select></div>'
   +'<div class="hint" id="l-hint">Ensayo: 24 °C óptimo, día largo (L14/D10) mejor.</div>'
   +'<div class="field"><label for="l-n">Notas, opcional</label><textarea id="l-n">'+esc(l.notes||'')+'</textarea></div>'
   +'<div class="btns"><button class="btn primary" id="l-save">Guardar</button>'+(id?'<button class="btn danger" id="l-del">Eliminar lote</button>':'')+'</div>');
  $('#l-x').onclick=closeSheet;
  function hint(){var t=parseFloat($('#l-temp').value),lg=parseFloat($('#l-light').value),m=[];
    if(t>0&&t<=22)m.push('A 20–22 °C el ensayo no obtuvo puesta natural.');
    if(t>24)m.push('A más temperatura el ensayo tuvo más mortalidad.');
    if(lg>=0&&lg<14)m.push('Con día corto el ensayo tuvo la peor supervivencia.');
    if($('#l-feed').value==='Poliqueto')m.push('Solo poliqueto: 25 % de supervivencia frente a más del 80 % con pienso compuesto (2 meses, sin ablar).');
    var h=$('#l-hint');h.className='hint'+(m.length?' warn':'');h.textContent=m.length?m.join(' '):'Ensayo: 24 °C óptimo, día largo (L14/D10) mejor.'}
  ['#l-temp','#l-light','#l-feed'].forEach(function(q){$(q).oninput=$(q).onchange=hint});hint();
  $('#l-save').onclick=function(){
    var name=($('#l-name').value||'').trim();if(!name){toast('Indica el nombre del lote');return}
    var o={id:id||uid(),name:name,temp:num('#l-temp'),light:num('#l-light'),feed:$('#l-feed').value,notes:($('#l-n').value||'').trim()};
    var items=S.lotes.filter(function(x){return x.id!==o.id});items.push(o);
    save('cfg','lotes',{items:items}).then(function(){closeSheet();toast('Lote guardado')}).catch(fail);
  };
  if(id)$('#l-del').onclick=function(){confirmBox('¿Eliminar el lote? Los animales quedan sin lote.',function(){
    var jobs=S.animals.filter(function(a){return a.lote===id}).map(function(a){var o=Object.assign({},a);delete o.lote;return save('animals',a.id,o)});
    Promise.all(jobs).then(function(){return save('cfg','lotes',{items:S.lotes.filter(function(x){return x.id!==id})})}).then(function(){toast('Lote eliminado')}).catch(fail);
  },'Eliminar')};
}

/* ---------- Eventos de la interfaz ---------- */
$('#main').addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act,id=el.dataset.id;
  if(act==='open'){S.aid=id;S.tab='ficha';render();$('#main').scrollTop=0}
  else if(act==='back'){S.tab='animales';render()}
  else if(act==='filter'){S.filter=el.dataset.f;render()}
  else if(act==='go'){S.tab=el.dataset.v;render();$('#main').scrollTop=0}
  else if(act==='rmark'){rondaMark(id,el.dataset.type)}
  else if(act==='edit-lote'){openLote(id)}
  else if(act==='reg'){openReg(el.dataset.type,id)}
  else if(act==='new-animal'){openAnimalForm()}
  else if(act==='edit-animal'){openAnimalForm(id)}
  else if(act==='del-ev'){confirmBox('¿Borrar este evento?',function(){
    var e=S.events.filter(function(x){return x.id===id})[0],a=e&&S.byId[e.animalId];
    remove('events',id).then(function(){
      if(e&&e.type==='baja'&&a){var o=Object.assign({},a,{status:'vivo'});delete o.deathTs;return save('animals',a.id,o)}
    }).then(function(){toast('Evento borrado')}).catch(fail);
  },'Borrar')}
  else if(act==='del-animal'){confirmBox('¿Eliminar este animal y todo su historial?',function(){
    var evs=S.events.filter(function(x){return x.animalId===id});
    Promise.all(evs.map(function(x){return remove('events',x.id)})).then(function(){return remove('animals',id)}).then(function(){S.tab='animales';render();toast('Animal eliminado')}).catch(fail);
  },'Eliminar')}
  else if(act==='export'){doExport()}
  else if(act==='share'){doShare()}
  else if(act==='save-cfg'){
    var o={wa:($('#s-wa').value||'').replace(/\D/g,'')};
    Object.keys(DEF).forEach(function(k){if(k==='wa')return;var v=num('#s-'+k);o[k]=v===null?DEF[k]:v});
    save('cfg','params',o).then(function(){toast('Ajustes guardados')}).catch(fail);
  }
  else if(act==='reset-cfg'){save('cfg','params',Object.assign({},DEF,{wa:P().wa})).then(function(){toast('Valores del ensayo restablecidos')}).catch(fail)}
});
$('#main').addEventListener('change',function(ev){if(ev.target.id==='rd'&&ev.target.value){S.rondaDate=ev.target.value;render()}
  if(ev.target.id==='imp'&&ev.target.files[0]){doImport(ev.target.files[0]);ev.target.value=''}});
$('#main').addEventListener('input',function(ev){
  if(ev.target.id==='q'){S.q=ev.target.value;$('#lista').innerHTML=listaAnimales()}
});
document.querySelectorAll('.nav [data-tab]').forEach(function(b){b.onclick=function(){S.tab=b.dataset.tab;render();$('#main').scrollTop=0}});
$('#fab').onclick=function(){openReg(null,S.tab==='ficha'?S.aid:null)};
$('#sheetbg').addEventListener('click',function(e){if(e.target.id==='sheetbg')closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

/* ---------- Arranque ---------- */
$('#today').textContent=new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'});
render();
(function init(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(function(ok){S.persist=ok;if(S.tab==='ajustes')render()}).catch(function(){});
  localDb().then(function(db){
    S.db=db;sub('animals','animals');sub('events','events');sub('cfg','cfg');render();
  }).catch(function(){S.db=null;render()});
})();
})();
</script>
</body>
